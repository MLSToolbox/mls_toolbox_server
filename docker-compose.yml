services:
  server:
    build:
      context: .
      args:
        ENVIRONMENT: ${ENVIRONMENT:-local}
    image: ${IMAGE_TAG:-mls_toolbox_server:local}
    container_name: ${CONTAINER_NAME:-mls_toolbox_server}
    volumes:
      - ./app:/app
    ports:
      - "${EXTERNAL_PORT:-5000}:${PORT:-5000}"
    environment:
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-5000}
      - DEBUG=${DEBUG:-False}
      - CODE_GENERATOR_URL=${CODE_GENERATOR_URL:-http://mls_code_generator:5050}
      - CODE_ASSESSMENT_URL=${CODE_ASSESSMENT_URL:-http://mls_toolbox_code_assessment:5060}
      - EXECUTION_MODE=prod
      - ENVIRONMENT=${ENVIRONMENT:-local}
    networks:
      - mls-network
    restart: unless-stopped

networks:
  mls-network:
    name: ${DOCKER_NETWORK:-mls-network}
